<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable - EduPlus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    /* === THEME VARIABLES === */
    :root {
        --primary: #6D28D9;
        --primary-hover: #5B21B6;
        --secondary: #F97316;
        --bg-color: #F8FAFC;
        --text-color: #1E293B;
        --card-bg: #FFFFFF;
        --border-color: #E2E8F0;
        --sidebar-bg: #FFFFFF;
        --sidebar-hover: #F1F5F9;
        --table-row-hover: #f8fafc;
        --muted-text: #64748b;
    }

    body.dark-mode {
        --bg-color: #0F172A;
        --text-color: #F1F5F9;
        --card-bg: #1E293B;
        --border-color: #334155;
        --primary: #8B5CF6;
        --primary-hover: #7C3AED;
        --secondary: #FB923C;
        --sidebar-bg: #1E293B;
        --sidebar-hover: #334155;
        --table-row-hover: #334155;
        --muted-text: #94a3b8;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        overflow-x: hidden;
        transition: all 0.3s ease;
    }

    /* === SIDEBAR === */
    .sidebar {
        width: 260px; height: 100vh; background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color); position: fixed;
        top: 0; left: 0; z-index: 1000; transition: all 0.3s ease;
        display: flex; flex-direction: column;
    }
    .sidebar-brand {
        padding: 20px; font-size: 1.5rem; font-weight: 800;
        color: var(--primary); text-decoration: none;
        display: flex; align-items: center; gap: 10px;
        border-bottom: 1px solid var(--border-color);
    }
    .sidebar-menu { list-style: none; padding: 15px 10px; margin: 0; flex: 1; overflow-y: auto; }
    .sidebar-menu li { margin-bottom: 5px; }
    .sidebar-menu a {
        display: flex; align-items: center; gap: 15px; padding: 12px 15px;
        color: var(--text-color); text-decoration: none; border-radius: 10px;
        font-weight: 500; transition: 0.2s;
    }
    .sidebar-menu a:hover { background-color: var(--sidebar-hover); color: var(--primary); }
    .sidebar-menu a.active { background-color: var(--primary); color: white; }
    .sidebar-menu a i { width: 20px; text-align: center; }

    /* === MAIN CONTENT === */
    .main-content { margin-left: 260px; padding: 20px; transition: all 0.3s ease; min-height: 100vh; }

    /* === TOP NAVBAR === */
    .top-navbar {
        background-color: var(--card-bg); border-radius: 15px; padding: 15px 25px;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        margin-bottom: 25px;
    }
    .school-info h4 { margin: 0; font-weight: 700; font-size: 1.2rem; }
    .school-info p { margin: 0; font-size: 0.85rem; color: var(--muted-text); }
    .top-nav-right { display: flex; align-items: center; gap: 20px; }
    .icon-btn { background: transparent; border: none; font-size: 1.2rem; color: var(--text-color); cursor: pointer; position: relative; }
    .icon-btn:hover { color: var(--primary); }
    .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 20px; transition: 0.2s; }
    .user-profile:hover { background-color: var(--sidebar-hover); }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
    .mobile-toggle { display: none; background: transparent; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer; }

    /* === PAGE CONTENT === */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-header h2 { font-weight: 800; margin: 0; }

    .btn-upload {
        background-color: var(--secondary); color: white; border: none;
        padding: 10px 20px; border-radius: 10px; font-weight: 600;
        display: flex; align-items: center; gap: 8px; transition: 0.3s;
    }
    .btn-upload:hover { background-color: #EA580C; transform: translateY(-2px); }

    .form-card {
        background-color: var(--card-bg); border-radius: 15px; padding: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
        margin-bottom: 25px;
    }

    .form-label { color: var(--text-color); font-weight: 600; }
    .form-control, .form-select {
        padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);
        background-color: var(--bg-color); color: var(--text-color);
    }
    .form-control:focus, .form-select:focus {
        border-color: var(--primary); box-shadow: none;
        background-color: var(--bg-color); color: var(--text-color);
    }
    .form-control::placeholder { color: var(--muted-text); }

    .btn-add-schedule {
        background-color: var(--primary); color: white; border: none;
        padding: 12px 20px; border-radius: 10px; font-weight: 700;
        width: 100%; transition: 0.3s;
    }
    .btn-add-schedule:hover { background-color: var(--primary-hover); }

    /* === TIMETABLE TABLE === */
    .table-card {
        background-color: var(--card-bg); border-radius: 15px; padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color);
    }

    /* ===== DARK MODE TABLE FIX ===== */
    .table {
        margin: 0;
        --bs-table-color: var(--text-color);
        --bs-table-bg: transparent;
        --bs-table-border-color: var(--border-color);
        --bs-table-hover-color: var(--text-color);
        --bs-table-hover-bg: var(--table-row-hover);
        color: var(--text-color) !important;
    }
    .table thead th {
        background-color: var(--bg-color) !important;
        border-bottom: 2px solid var(--border-color) !important;
        color: var(--text-color) !important;
        font-weight: 700; padding: 15px;
    }
    .table tbody td {
        padding: 15px; vertical-align: middle;
        background-color: transparent !important;
        border-bottom: 1px solid var(--border-color) !important;
        color: var(--text-color) !important;
    }
    .table tbody tr:hover { background-color: var(--table-row-hover) !important; }
    .table tbody tr:hover td {
        color: var(--text-color) !important;
        background-color: transparent !important;
    }
    /* ================================ */

    .class-badge { background-color: rgba(109, 40, 217, 0.15); color: var(--primary); padding: 5px 12px; border-radius: 20px; font-weight: 600; display: inline-block; }
    .subject-badge { background-color: rgba(249, 115, 22, 0.15); color: var(--secondary); padding: 5px 12px; border-radius: 20px; font-weight: 600; display: inline-block; }

    .action-btn { background: transparent; border: none; font-size: 1rem; cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s; }
    .btn-delete { color: #dc2626; }
    .btn-delete:hover { background-color: rgba(220, 38, 38, 0.15); }

    /* === RESPONSIVE === */
    @media (max-width: 991px) {
        .sidebar { left: -260px; }
        .sidebar.active { left: 0; }
        .main-content { margin-left: 0; }
        .mobile-toggle { display: block; }
    }
</style>
</head>
<body>

    <!-- === SIDEBAR === -->
    <div class="sidebar" id="sidebar">
        <a href="dashboard.html" class="sidebar-brand"><i class="fas fa-graduation-cap"></i> EduPlus</a>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="find-substitute.html"><i class="fas fa-search"></i> Find Substitute</a></li>
            <li><a href="teachers.html"><i class="fas fa-users"></i> All Teachers</a></li>
            <li><a href="timetable.html" class="active"><i class="fas fa-calendar-alt"></i> Timetable</a></li>
            <li><a href="reports.html"><i class="fas fa-chart-line"></i> Reports & Analytics</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="mt-4"><a href="login.html" style="color: #dc2626;"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </div>

    <!-- === MAIN CONTENT === -->
    <div class="main-content">

        <!-- Top Navbar -->
        <div class="top-navbar">
            <div class="d-flex align-items-center gap-3">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="school-info">
                    <h4>Manage Timetable</h4>
                    <p>Add classes manually or upload your schedule</p>
                </div>
            </div>
            <div class="top-nav-right">
                <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">M</div>
                </div>
            </div>
        </div>

        <!-- Page Header & Upload Button -->
        <div class="page-header">
            <h2>Class Schedule</h2>
            <button class="btn-upload" onclick="uploadFileAlert()">
                <i class="fas fa-file-upload"></i> Upload Excel/PDF
            </button>
        </div>

        <!-- Manual Entry Form -->
        <div class="form-card">
            <h5 class="fw-bold mb-4"><i class="fas fa-plus-circle me-2" style="color: var(--primary);"></i> Add Class Manually</h5>
            <form id="timetableForm" onsubmit="addToTimetable(event)">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Day</label>
                        <select class="form-select" id="day" required>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Period</label>
                        <select class="form-select" id="period" required>
                            <option value="1">1st</option>
                            <option value="2">2nd</option>
                            <option value="3">3rd</option>
                            <option value="4">4th</option>
                            <option value="5">5th</option>
                            <option value="6">6th</option>
                            <option value="7">7th</option>
                            <option value="8">8th</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Class</label>
                        <input type="text" class="form-control" id="class" placeholder="e.g. 10-A" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject" placeholder="e.g. Mathematics" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Teacher</label>
                        <select class="form-select" id="teacher" required>
                            <option value="" disabled selected>Select Teacher</option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn-add-schedule">
                            <i class="fas fa-plus me-2"></i> Add to Schedule
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Timetable Data Table -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Period</th>
                            <th>Class</th>
                            <th>Subject</th>
                            <th>Teacher</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody">
                        <!-- Data will be loaded here by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // === THEME TOGGLE ===
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('eduplus_theme', 'dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                localStorage.setItem('eduplus_theme', 'light');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // === LOCAL STORAGE DATA ===
        let timetableData = [];
        let teachersData = [];

        // === LOAD TEACHERS FOR DROPDOWN ===
        function loadTeachersDropdown() {
            const savedTeachers = localStorage.getItem('eduplus_teachers');
            if (savedTeachers) {
                teachersData = JSON.parse(savedTeachers);
            } else {
                teachersData = [
                    { name: "Mr. Ahmed Ali", subject: "Mathematics" },
                    { name: "Ms. Fatima Khan", subject: "English" }
                ];
            }

            const dropdown = document.getElementById('teacher');
            dropdown.innerHTML = '<option value="" disabled selected>Select Teacher</option>';

            teachersData.forEach(t => {
                dropdown.innerHTML += `<option value="${t.name}">${t.name} (${t.subject})</option>`;
            });
        }

        // === RENDER TABLE ===
        function renderTimetable() {
            const savedTimetable = localStorage.getItem('eduplus_timetable');
            if (savedTimetable) {
                timetableData = JSON.parse(savedTimetable);
            }

            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';

            if (timetableData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4" style="color: var(--muted-text);">No schedule added yet. Add your first class above.</td></tr>';
                return;
            }

            const dayOrder = { "Monday": 1, "Tuesday": 2, "Wednesday": 3, "Thursday": 4, "Friday": 5, "Saturday": 6 };
            timetableData.sort((a, b) => {
                if (dayOrder[a.day] !== dayOrder[b.day]) return dayOrder[a.day] - dayOrder[b.day];
                return parseInt(a.period) - parseInt(b.period);
            });

            timetableData.forEach((entry, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${entry.day}</strong></td>
                        <td>${entry.period}</td>
                        <td><span class="class-badge">${entry.class}</span></td>
                        <td><span class="subject-badge">${entry.subject}</span></td>
                        <td>${entry.teacher}</td>
                        <td>
                            <button class="action-btn btn-delete" onclick="deleteEntry(${index})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // === ADD TO TIMETABLE ===
        function addToTimetable(event) {
            event.preventDefault();

            const day = document.getElementById('day').value;
            const period = document.getElementById('period').value;
            const className = document.getElementById('class').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const teacher = document.getElementById('teacher').value;

            if (!className || !subject || !teacher) {
                alert('Please fill all fields!');
                return;
            }

            const newEntry = { day, period, class: className, subject, teacher };
            timetableData.push(newEntry);
            localStorage.setItem('eduplus_timetable', JSON.stringify(timetableData));

            document.getElementById('timetableForm').reset();
            loadTeachersDropdown();
            renderTimetable();
        }

        // === DELETE ENTRY ===
        function deleteEntry(index) {
            if (confirm("Are you sure you want to remove this class from the timetable?")) {
                timetableData.splice(index, 1);
                localStorage.setItem('eduplus_timetable', JSON.stringify(timetableData));
                renderTimetable();
            }
        }

        // === UPLOAD ALERT ===
        function uploadFileAlert() {
            alert("Feature Coming Soon!\n\nYe feature hum Google Apps Script se connect karne ke baad activate karenge, jahan aap Excel/PDF upload karenge aur data khud bhar jayega.");
        }

        // === LOAD ON START ===
        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('eduplus_theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }

            const userStr = localStorage.getItem('eduplus_user');
            if (userStr) {
                const user = JSON.parse(userStr);
                document.getElementById('userAvatar').innerText = (user.name || "A").charAt(0).toUpperCase();
            }

            loadTeachersDropdown();
            renderTimetable();
        });
    </script>
</body>
</html>
