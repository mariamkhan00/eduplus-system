<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlus - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #050505;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 1s ease;
            position: relative;
        }

        body.light-on {
            background-color: #121212;
        }

        .top-logo {
            position: absolute;
            top: 25px;
            left: 40px;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        body.light-on .top-logo { color: #8B5CF6; }

        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* LAMP SECTION */
        .lamp-side {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lamp-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-top: -50px; 
        }

        .lamp-base {
            width: 80px;
            height: 15px;
            background-color: #333;
            border-radius: 50%;
            margin-top: 180px;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        .lamp-pole {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 200px;
            background-color: #2a2a2a;
            z-index: 1;
        }

        .lamp-shade {
            width: 140px;
            height: 70px;
            background-color: #444;
            border-top-left-radius: 70px;
            border-top-right-radius: 70px;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.5s ease;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
        }

        .lamp-bulb {
            width: 35px;
            height: 35px;
            background-color: #555;
            border-radius: 50%;
            position: absolute;
            bottom: -17px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        .pull-string-wrapper {
            position: absolute;
            top: 40px;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s ease;
        }
        
        .pull-string-wrapper:hover {
            transform: translateY(5px);
        }

        .pull-string {
            width: 3px;
            height: 70px;
            background-color: #666;
        }
        .pull-string::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -5px;
            width: 14px;
            height: 14px;
            background-color: #d4a373;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.8);
        }

        .click-text {
            position: absolute;
            top: 80px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            animation: pulseText 1.5s infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        @keyframes pulseText {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }

        .light-beam {
            position: absolute;
            top: 70px;
            width: 0;
            height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-top: 600px solid rgba(255, 235, 150, 0.02);
            transition: border-top-color 1s ease;
            z-index: 0;
            pointer-events: none;
        }

        body.light-on .lamp-shade {
            box-shadow: 0 -10px 30px rgba(255, 234, 148, 0.2), inset 0 -10px 20px rgba(0,0,0,0.5);
        }
        body.light-on .lamp-bulb {
            background-color: #ffea94;
            box-shadow: 0 0 60px 25px rgba(255, 234, 148, 0.8);
        }
        body.light-on .light-beam {
            border-top-color: rgba(255, 235, 150, 0.15);
        }
        body.light-on .click-text {
            display: none;
        }

        /* REGISTER FORM */
        .form-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 40px;
            border-radius: 20px;
            width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 100;
            
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; 
        }

        body.light-on .register-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .register-container h2 {
            color: #fff;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .register-container p {
            color: #888;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: color 0.3s;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            appearance: none;
        }

        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            pointer-events: none;
        }

        .input-group input::placeholder { color: #666; }
        .input-group select option { background: #1a1a1a; color: #fff; }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: #8B5CF6;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }
        
        .input-group input:focus + i,
        .input-group input:not(:placeholder-shown) + i {
            color: #8B5CF6;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #6D28D9;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
        }

        .btn-register:hover {
            background: #5B21B6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.5);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #F97316;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-link a:hover {
            text-decoration: underline;
            color: #FB923C;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }
        .row-inputs .input-group {
            flex: 1;
        }
        
        /* ================= MOBILE RESPONSIVE FIX ================= */
        @media (max-width: 991px) {
            .main-wrapper {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 80px;
                padding-bottom: 40px;
            }
            .lamp-side {
                flex: none;
                height: auto;
                min-height: 200px;
                align-items: flex-start;
                margin-bottom: 10px;
            }
            .lamp-container {
                transform: scale(0.7);
                margin-top: -40px;
            }
            .light-beam {
                border-left-width: 150px;
                border-right-width: 150px;
                border-top-width: 300px;
            }
            .form-side {
                flex: none;
                padding: 0 15px;
                width: 100%;
            }
            .register-container { 
                width: 100%; 
                padding: 25px 20px;
            }
            .row-inputs { 
                flex-direction: column; 
                gap: 0; 
            }
            .top-logo { 
                top: 20px; 
                left: 20px; 
                font-size: 1.5rem; 
                z-index: 9999;
            }
        }
    </style>
</head>
<body id="bodyElement">

    <!-- Corner Logo -->
    <a href="index.html" class="top-logo"><i class="fas fa-graduation-cap"></i> EduPlus</a>

    <div class="main-wrapper">
        
        <!-- LEFT: LAMP -->
        <div class="lamp-side">
            <div class="lamp-container">
                <div class="lamp-shade">
                    <div class="lamp-bulb"></div>
                    <div class="pull-string-wrapper" id="pullString">
                        <div class="pull-string"></div>
                        <div class="click-text">Click to turn on</div>
                    </div>
                </div>
                <div class="light-beam"></div>
                <div class="lamp-pole"></div>
                <div class="lamp-base"></div>
            </div>
        </div>

        <!-- RIGHT: REGISTER FORM -->
        <div class="form-side">
            <div class="register-container">
                <h2>Create Account</h2>
                <p>Join EduPlus to manage your institution</p>
                
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="row-inputs">
                        <div class="input-group select-wrapper">
                            <select id="instType" required>
                                <option value="" disabled selected>Select Type</option>
                                <option value="School">School</option>
                                <option value="College">College</option>
                            </select>
                            <i class="fas fa-building"></i>
                        </div>
                        <div class="input-group">
                            <input type="text" id="schoolName" placeholder="Institution Name" required>
                            <i class="fas fa-school"></i>
                        </div>
                    </div>

                    <div class="row-inputs">
                        <div class="input-group">
                            <input type="text" id="adminName" placeholder="Admin Name" required>
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-group">
                            <input type="tel" id="phone" placeholder="WhatsApp Number" required>
                            <i class="fab fa-whatsapp"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="Create Password" required minlength="6">
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <button type="submit" class="btn-register" id="registerBtn">Sign Up</button>
                </form>

                <div class="login-link">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const pullString = document.getElementById('pullString');
        const body = document.body;

        pullString.addEventListener('click', () => {
            body.classList.toggle('light-on');
        });

        window.addEventListener('scroll', () => {
            body.classList.add('light-on');
        }, { once: true });

        window.addEventListener('touchstart', () => {
            if(!body.classList.contains('light-on')) {
                body.classList.add('light-on');
            }
        }, { once: true });

        function handleRegister(event) {
            event.preventDefault();
            const btn = document.getElementById('registerBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                btn.style.background = '#16a34a';
                
                const schoolName = document.getElementById('schoolName').value;
                localStorage.setItem('eduplus_user', JSON.stringify({
                    name: "Admin",
                    school_name: schoolName
                }));

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);
            }, 1500);
        }
    </script>
</body>
</html>
