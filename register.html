
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050705">
    <title>EduPlus - Register</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/mariamkhan00/eduplus-system/main/favicon.png">

    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* EduPlus Home Page Colors */
            --navy: #102b4e;
            --deep: #0b203b;
            --blue: #1d568b;
            --gold: #f2b632;
            --gold-dark: #d99a12;
            --ink: #1d2b3c;
            --muted: #687789;
            --soft: #f4f7fb;
            --line: #e6ebf1;
            --green: #176b4a;

            /* Initial screen remains black */
            --bg-main: #050705;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "DM Sans", sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            transition: background-color 1s ease;

            /* Original cyber grid */
            background-image:
                linear-gradient(rgba(242,182,50,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(242,182,50,.035) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        body.light-on {
            background-color: #0b203b;
        }

        /* ================= TOP CORNER LOGO ================= */

        .top-logo {
            position: absolute;
            top: 25px;
            left: 40px;
            color: white;
            font-family: "Fredoka", sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            letter-spacing: -1px;
            transition: color .3s ease;
        }

        .top-logo i {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(242,182,50,.8);
        }

        .top-logo:hover {
            color: var(--gold);
        }

        /* ================= PARTICLES ================= */

        .particles-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            filter: blur(1px);
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: .2;
            }

            50% {
                transform: translateY(-50px) translateX(25px);
                opacity: .6;
            }
        }

        /* ================= MAIN WRAPPER ================= */

        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* ================= LAMP SECTION ================= */

        .lamp-side {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lamp-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-top: -50px;
        }

        .lamp-base {
            width: 90px;
            height: 12px;
            background: linear-gradient(to bottom, #222, #050705);
            border-radius: 50%;
            margin-top: 210px;
            position: relative;
            z-index: 2;
            box-shadow:
                0 15px 25px rgba(0,0,0,.8),
                0 0 10px rgba(242,182,50,.12);
        }

        .lamp-pole {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 220px;
            background: linear-gradient(to right, #111, #444, #111);
            z-index: 1;
            border-radius: 4px;
        }

        .lamp-shade {
            width: 160px;
            height: 80px;
            background: linear-gradient(to bottom, #1a1a1a, #050705);
            border-top-left-radius: 80px;
            border-top-right-radius: 80px;
            position: relative;
            z-index: 3;
            transition: box-shadow .5s ease;
            box-shadow:
                inset 0 -15px 25px rgba(0,0,0,.8),
                0 5px 15px rgba(0,0,0,.5);
            border-bottom: 2px solid #111;
        }

        .lamp-bulb {
            width: 40px;
            height: 40px;
            background-color: #222;
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color .5s ease, box-shadow .5s ease;
            z-index: 2;
        }

        .pull-string-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform .2s ease;
        }

        .pull-string-wrapper:hover {
            transform: translateY(5px);
        }

        .pull-string {
            width: 2px;
            height: 80px;
            background-color: #666;
        }

        .pull-string::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: -5px;
            width: 12px;
            height: 12px;
            background-color: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--gold);
        }

        .click-text {
            position: absolute;
            top: 90px;
            color: var(--gold);
            font-size: .75rem;
            font-weight: 700;
            white-space: nowrap;
            animation: pulseText 1.5s infinite;
            text-shadow: 0 0 10px rgba(242,182,50,.5);
            background: rgba(0,0,0,.8);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(242,182,50,.3);
        }

        @keyframes pulseText {
            0% {
                opacity: .5;
                transform: scale(.95);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: .5;
                transform: scale(.95);
            }
        }

        .light-beam {
            position: absolute;
            top: 80px;
            width: 0;
            height: 0;
            border-left: 350px solid transparent;
            border-right: 350px solid transparent;
            border-top: 600px solid rgba(242,182,50,0);
            transition: border-top-color 1s ease;
            z-index: 1;
            pointer-events: none;
            filter: blur(15px);
        }

        /* Lamp ON effect */

        body.light-on .lamp-shade {
            box-shadow:
                inset 0 -15px 25px rgba(0,0,0,.8),
                0 -10px 40px rgba(242,182,50,.25);
        }

        body.light-on .lamp-bulb {
            background-color: #fff;
            box-shadow:
                0 0 40px 15px var(--gold),
                0 0 80px 30px rgba(242,182,50,.4);
        }

        body.light-on .light-beam {
            border-top-color: rgba(242,182,50,.12);
        }

        body.light-on .click-text {
            display: none;
        }

        /* ================= REGISTER FORM ================= */

        .form-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255,255,255,.97);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(242,182,50,.25);
            padding: 30px 40px;
            border-radius: 20px;
            width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,.35);
            z-index: 100;

            opacity: 0;
            transform: translateY(40px) scale(.95);
            transition: all .8s cubic-bezier(.175,.885,.32,1.275);
            pointer-events: none;
        }

        body.light-on .register-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            border: 1px solid rgba(242,182,50,.55);
            box-shadow: 0 15px 45px rgba(0,0,0,.3);
        }

        .register-container h2 {
            color: var(--navy);
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 1.9rem;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .register-container p {
            color: var(--muted);
            text-align: center;
            margin-bottom: 25px;
            font-size: .9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #738094;
            transition: color .3s;
            z-index: 2;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            font-size: .95rem;
            outline: none;
            transition: .3s;
            appearance: none;
        }

        .select-wrapper::after {
            content: "\f107";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .input-group input::placeholder {
            color: #8793a1;
        }

        .input-group select option {
            background: white;
            color: var(--ink);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--gold-dark);
            background: white;
            box-shadow: 0 0 0 3px rgba(242,182,50,.15);
        }

        .input-group input:focus + i,
        .input-group input:not(:placeholder-shown) + i {
            color: var(--gold-dark);
        }

        /* ================= REGISTER BUTTON ================= */

        .btn-register {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--deep);
            border: 1px solid var(--gold);
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: .3s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(242,182,50,.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-register:hover {
            background: #ffd16a;
            border-color: #ffd16a;
            color: var(--deep);
            box-shadow: 0 8px 25px rgba(242,182,50,.35);
            transform: translateY(-2px);
        }

        .btn-register:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: .9rem;
        }

        .login-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 800;
            transition: .3s;
        }

        .login-link a:hover {
            color: var(--gold-dark);
            text-decoration: underline;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
        }

        .row-inputs .input-group {
            flex: 1;
            min-width: 0;
        }

        /* ================= MOBILE RESPONSIVE ================= */

        @media (max-width: 991px) {
            .main-wrapper {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 80px;
                padding-bottom: 40px;
            }

            .lamp-side {
                flex: none;
                height: auto;
                min-height: 200px;
                align-items: flex-start;
                margin-bottom: 20px;
            }

            .lamp-container {
                transform: scale(.75);
                margin-top: -20px;
            }

            .light-beam {
                border-left-width: 180px;
                border-right-width: 180px;
                border-top-width: 350px;
            }

            .form-side {
                flex: none;
                padding: 0 15px;
                width: 100%;
            }

            .register-container {
                width: 100%;
                max-width: 480px;
                padding: 25px 20px;
            }

            .row-inputs {
                flex-direction: column;
                gap: 0;
            }

            .top-logo {
                top: 20px;
                left: 20px;
                font-size: 1.5rem;
                z-index: 9999;
            }
        }

        @media (max-width: 380px) {
            .register-container {
                padding: 22px 16px;
            }

            .register-container h2 {
                font-size: 1.65rem;
            }

            .top-logo {
                font-size: 1.35rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .particle,
            .click-text {
                animation: none;
            }

            .register-container {
                transition: none;
            }
        }
    </style>
</head>

<body id="bodyElement">

    <!-- Particles Background -->
    <div class="particles-container" id="particles"></div>

    <!-- Corner Logo -->
    <a href="index.html" class="top-logo">
        <i class="fas fa-graduation-cap"></i>
        EduPlus
    </a>

    <div class="main-wrapper">

        <!-- LEFT: LAMP -->
        <div class="lamp-side">
            <div class="lamp-container">

                <div class="lamp-shade">
                    <div class="lamp-bulb"></div>

                    <div class="pull-string-wrapper" id="pullString">
                        <div class="pull-string"></div>
                        <div class="click-text">Click to turn on</div>
                    </div>
                </div>

                <div class="light-beam"></div>
                <div class="lamp-pole"></div>
                <div class="lamp-base"></div>

            </div>
        </div>

        <!-- RIGHT: REGISTER FORM -->
        <div class="form-side">

            <div class="register-container">

                <h2>Create Account</h2>
                <p>Join EduPlus to manage your institution</p>

                <form id="registerForm" onsubmit="handleRegister(event)">

                    <div class="row-inputs">

                        <div class="input-group select-wrapper">
                            <select id="instType" required>
                                <option value="" disabled selected>Select Type</option>
                                <option value="School">School</option>
                                <option value="College">College</option>
                            </select>
                            <i class="fas fa-building"></i>
                        </div>

                        <div class="input-group">
                            <input type="text" id="schoolName" placeholder="Institution Name" required>
                            <i class="fas fa-school"></i>
                        </div>

                    </div>

                    <div class="row-inputs">

                        <div class="input-group">
                            <input type="text" id="adminName" placeholder="Admin Name" required>
                            <i class="fas fa-user"></i>
                        </div>

                        <div class="input-group">
                            <input type="tel" id="phone" placeholder="WhatsApp Number" required>
                            <i class="fab fa-whatsapp"></i>
                        </div>

                    </div>

                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="Create Password" required minlength="6">
                        <i class="fas fa-lock"></i>
                    </div>

                    <button type="submit" class="btn-register" id="registerBtn">
                        Sign Up
                    </button>

                </form>

                <div class="login-link">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </div>

            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>

        // ================= GENERATE PARTICLES =================

        const particlesContainer = document.getElementById("particles");

        for (let i = 0; i < 15; i++) {

            let particle = document.createElement("div");
            particle.classList.add("particle");

            let size = Math.random() * 4 + 1;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particle.style.animationDuration = `${Math.random() * 10 + 5}s`;

            particlesContainer.appendChild(particle);
        }

        // ================= LAMP INTERACTION =================

        const pullString = document.getElementById("pullString");
        const body = document.body;

        // Manual lamp click
        pullString.addEventListener("click", () => {
            body.classList.toggle("light-on");
        });

        // Auto light on scroll
        window.addEventListener("scroll", () => {
            body.classList.add("light-on");
        }, { once: true });

        // Auto light on mobile touch
        window.addEventListener("touchstart", () => {
            if (!body.classList.contains("light-on")) {
                body.classList.add("light-on");
            }
        }, { once: true });

        // ================= REGISTER FORM =================

        function handleRegister(event) {

            event.preventDefault();

            const btn = document.getElementById("registerBtn");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';
            btn.disabled = true;
            btn.style.color = "#fff";

            setTimeout(() => {

                btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                btn.style.background = "var(--green)";
                btn.style.borderColor = "var(--green)";
                btn.style.color = "#fff";

                const schoolName = document.getElementById("schoolName").value;

                localStorage.setItem("eduplus_user", JSON.stringify({
                    name: "Admin",
                    school_name: schoolName
                }));

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            }, 1500);
        }

    </script>

</body>
</html>
