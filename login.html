<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlus - Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0b0b0b; /* Andhera Background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 1s ease;
            position: relative;
        }

        /* Jab Light On hogi tab background thora roshan hoga */
        body.light-on {
            background-color: #1a1a1a;
        }

        /* ================= LAMP DESIGN ================= */
        .lamp-container {
            position: absolute;
            top: 0;
            left: 20%; /* Lamp left side par hoga */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Lamp ka Wire */
        .lamp-wire {
            width: 4px;
            height: 150px;
            background-color: #333;
        }

        /* Lamp ka Cover (Shade) */
        .lamp-shade {
            width: 120px;
            height: 60px;
            background-color: #222;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.5s ease;
        }

        /* Bulb */
        .lamp-bulb {
            width: 30px;
            height: 30px;
            background-color: #444;
            border-radius: 50%;
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Pull String (Zanjeer) */
        .pull-string {
            position: absolute;
            top: 30px;
            left: 50%;
            width: 2px;
            height: 80px;
            background-color: #555;
            cursor: pointer;
            transition: height 0.2s ease;
        }
        .pull-string::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -5px;
            width: 12px;
            height: 12px;
            background-color: #c98a2d;
            border-radius: 50%;
        }
        /* Hover effect on string */
        .pull-string:hover {
            height: 90px;
        }

        /* LIGHT CONE (Roshnii) */
        .light-beam {
            position: absolute;
            top: 210px; /* Shade ke neechay se start */
            width: 0;
            height: 0;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-top: 500px solid rgba(255, 235, 150, 0.15);
            transition: border-top-color 0.5s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* ======= JAB LIGHT ON HOGI ======= */
        body.light-on .lamp-bulb {
            background-color: #ffea94;
            box-shadow: 0 0 50px 20px rgba(255, 234, 148, 0.8);
        }
        body.light-on .light-beam {
            border-top-color: rgba(255, 235, 150, 0.4);
        }


        /* ================= LOGIN FORM ================= */
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            z-index: 100;
            
            /* Pehle form invisible hoga */
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none; /* Click nahi ho sakta jab tak light on na ho */
        }

        /* Jab light on hogi tab form samne aayega */
        body.light-on .login-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .login-container h2 {
            color: #fff;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-container p {
            color: #aaa;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #6D28D9; /* Aapka Purple Theme */
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #6D28D9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #5B21B6;
            transform: translateY(-2px);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .lamp-container { left: 50%; transform: translateX(-50%); }
            .light-beam { border-left-width: 150px; border-right-width: 150px; border-top-width: 300px; }
            .login-container { width: 90%; padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- Lamp Section -->
    <div class="lamp-container">
        <div class="lamp-wire"></div>
        <div class="lamp-shade">
            <div class="lamp-bulb"></div>
            <!-- Pull string par click karne se kya hoga -->
            <div class="pull-string" id="pullString" title="Click to turn on the light"></div>
        </div>
        <!-- Roshni ka beam -->
        <div class="light-beam"></div>
    </div>

    <!-- Login Form Section -->
    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Enter your details to access your account</p>
        
        <form action="dashboard.html">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <!-- JavaScript Animation Logic -->
    <script>
        const pullString = document.getElementById('pullString');
        const body = document.body;

        // Jab lamp ki zanjeer par click ho
        pullString.addEventListener('click', () => {
            // Light On / Off toggle karein
            body.classList.toggle('light-on');
        });
    </script>
</body>
</html>
