<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EduPlus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    /* === THEME VARIABLES === */
    :root {
        --primary: #6D28D9;      
        --primary-hover: #5B21B6;
        --secondary: #F97316;    
        --bg-color: #F8FAFC;
        --text-color: #1E293B;
        --card-bg: #FFFFFF;
        --border-color: #E2E8F0;
    }

    body.dark-mode {
        --bg-color: #0F172A;      
        --text-color: #F1F5F9; 
        --card-bg: #1E293B;
        --border-color: #334155;
        --primary: #8B5CF6;       
        --primary-hover: #7C3AED;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .login-wrapper {
        display: flex;
        height: 100vh;
    }

    /* Left Side Image */
    .login-left {
        flex: 1;
        background: url('https://raw.githubusercontent.com/mariamkhan00/eduplus-system/main/EduPlus%20Pakistani%20School%20Welcome.png') center/cover no-repeat;
        position: relative;
        display: none; 
    }

    .login-left::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, rgba(109, 40, 217, 0.85) 0%, rgba(15, 23, 42, 0.9) 100%);
    }

    .login-left-content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 50px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-left-content h1 {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .login-left-content p {
        font-size: 1.2rem;
        opacity: 0.9;
        line-height: 1.6;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    /* Right Side Form */
    .login-right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-color: var(--bg-color);
        position: relative;
    }

    .theme-toggle-btn { 
        position: absolute; top: 20px; right: 20px;
        background: transparent; border: none; color: var(--text-color); 
        font-size: 1.5rem; cursor: pointer; transition: 0.3s; 
    }
    .theme-toggle-btn:hover { color: var(--primary); }

    .login-box {
        width: 100%;
        max-width: 450px;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        border: 1px solid var(--border-color);
    }

    .brand-logo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--primary);
        text-align: center;
        margin-bottom: 10px;
        display: block;
        text-decoration: none;
    }

    .login-box h3 {
        text-align: center;
        font-weight: 700;
        margin-bottom: 30px;
        color: var(--text-color);
    }

    .form-label {
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--text-color);
    }

    .form-control {
        padding: 12px 15px;
        border-radius: 10px;
        border: 2px solid var(--border-color);
        font-size: 1rem;
        transition: 0.3s;
        background-color: transparent;
        color: var(--text-color);
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: none;
        background-color: transparent;
        color: var(--text-color);
    }

    .input-group-text {
        background: transparent;
        border: 2px solid var(--border-color);
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: var(--primary);
    }

    .form-control.with-icon {
        border-left: none;
        border-radius: 0 10px 10px 0;
    }

    .form-control.with-icon:focus {
        border-left: none;
    }

    .btn-login {
        background-color: var(--primary);
        color: white;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1.1rem;
        width: 100%;
        border: none;
        transition: 0.3s;
        margin-top: 10px;
    }

    .btn-login:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.95rem;
        color: var(--text-color);
    }

    .register-link a {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    .password-toggle {
        position: absolute;
        right: 15px;
        top: 42px;
        cursor: pointer;
        color: #888;
        z-index: 10;
    }

    @media (min-width: 992px) {
        .login-left {
            display: block; 
        }
    }
</style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Left Side (Image & Text) -->
        <div class="login-left">
            <div class="login-left-content">
                <a href="index.html" class="brand-logo text-white mb-4"><i class="fas fa-graduation-cap me-2"></i>EduPlus</a>
                <h1>Welcome Back!</h1>
                <p>Log in to manage your institution's timetable, track absentees, and find the perfect substitute teachers automatically.</p>
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="login-right">
            
            <!-- Theme Toggle -->
            <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>

            <div class="login-box">
                <a href="index.html" class="brand-logo d-lg-none"><i class="fas fa-graduation-cap me-2"></i>EduPlus</a>
                
                <h3>Sign In to Your Account</h3>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control with-icon" id="email" placeholder="admin@school.com" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control with-icon" id="password" placeholder="Enter your password" required>
                        </div>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword()" id="toggleIcon"></i>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe" style="font-size: 0.9rem;">Remember me</label>
                        </div>
                        <a href="#" style="color: var(--primary); font-size: 0.9rem; text-decoration: none; font-weight: 600;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        Login <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    
                    <div id="errorMsg" class="text-danger text-center mt-3" style="display: none; font-weight: 600;"></div>
                </form>

                <div class="register-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === THEME TOGGLE ===
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('eduplus_theme', 'dark');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                localStorage.setItem('eduplus_theme', 'light');
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('eduplus_theme');
            const icon = document.getElementById('theme-icon');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        });

        // === PASSWORD TOGGLE ===
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // === LOGIN FUNCTION (Demo) ===
        function handleLogin(event) {
            event.preventDefault(); 
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Logging in...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            // Fake delay (API integration baad mein hogi)
            setTimeout(() => {
                if(email === "admin@school.com" && password === "admin123") {
                    btn.innerHTML = '<i class="fas fa-check me-2"></i> Success!';
                    btn.style.background = '#28a745';
                    
                    // Save user info
                    localStorage.setItem('eduplus_user', JSON.stringify({
                        name: "Mariam Khan",
                        email: email,
                        role: "admin",
                        school_name: "Al-Noor Public School"
                    }));

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = "dashboard.html"; 
                    }, 1000);

                } else {
                    btn.innerHTML = 'Login <i class="fas fa-arrow-right ms-2"></i>';
                    btn.disabled = false;
                    btn.style.background = 'var(--primary)';
                    errorMsg.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i> Invalid email or password';
                    errorMsg.style.display = 'block';
                }
            }, 1500);
        }
    </script>
</body>
</html>
