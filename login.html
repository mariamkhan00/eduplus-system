<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlus - Login</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #050505; /* Full Black Background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 1s ease;
            position: relative;
        }

        /* Jab Light On hogi tab background thora sa roshan hoga (Dark Grey) */
        body.light-on {
            background-color: #121212;
        }

        /* ================= TOP CORNER LOGO ================= */
        .top-logo {
            position: absolute;
            top: 25px;
            left: 40px;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        body.light-on .top-logo {
            color: #8B5CF6; /* Light on hone par purple ho jayega */
        }

        /* ================= LAMP DESIGN ================= */
        .lamp-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%); /* Lamp ab bilkul center mein hoga */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Lamp ka Wire */
        .lamp-wire {
            width: 4px;
            height: 100px;
            background-color: #333;
        }

        /* Lamp ka Cover (Shade) */
        .lamp-shade {
            width: 120px;
            height: 60px;
            background-color: #1a1a1a;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
            position: relative;
            z-index: 2;
            transition: box-shadow 0.5s ease, background-color 0.5s ease;
        }

        /* Bulb */
        .lamp-bulb {
            width: 30px;
            height: 30px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }

        /* Pull String (Zanjeer) */
        .pull-string {
            position: absolute;
            top: 30px;
            left: 50%;
            width: 2px;
            height: 80px;
            background-color: #555;
            cursor: pointer;
            transition: height 0.2s ease;
        }
        .pull-string::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -5px;
            width: 12px;
            height: 12px;
            background-color: #c98a2d;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(201, 138, 45, 0.5);
        }
        /* Hover effect on string */
        .pull-string:hover {
            height: 90px;
        }

        /* LIGHT CONE (Roshni) */
        .light-beam {
            position: absolute;
            top: 160px; /* Shade ke neechay se start */
            width: 0;
            height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-top: 600px solid rgba(255, 235, 150, 0.02); /* Pehle invisible */
            transition: border-top-color 1s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* ======= JAB LIGHT ON HOGI ======= */
        body.light-on .lamp-shade {
            box-shadow: 0 -10px 30px rgba(255, 234, 148, 0.1);
        }
        body.light-on .lamp-bulb {
            background-color: #ffea94;
            box-shadow: 0 0 60px 25px rgba(255, 234, 148, 0.6); /* Bulb glow */
        }
        body.light-on .light-beam {
            border-top-color: rgba(255, 235, 150, 0.15); /* Roshni ka beam */
        }


        /* ================= LOGIN FORM ================= */
        .login-container {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 100;
            
            /* Form pehle chhupa hoga */
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; 
        }

        /* Jab light on hogi tab form samne aayega */
        body.light-on .login-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-container h2 {
            color: #fff;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-container p {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .input-group input:focus {
            border-color: #8B5CF6;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }
        
        .input-group input:focus + i,
        .input-group input:not(:placeholder-shown) + i {
            color: #8B5CF6;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #6D28D9;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
        }

        .btn-login:hover {
            background: #5B21B6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.5);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #F97316;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: #FB923C;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .top-logo { top: 20px; left: 20px; font-size: 1.5rem; }
            .light-beam { border-left-width: 150px; border-right-width: 150px; border-top-width: 400px; }
            .login-container { width: 90%; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Corner Logo -->
    <a href="index.html" class="top-logo"><i class="fas fa-graduation-cap"></i> EduPlus</a>

    <!-- Lamp Section -->
    <div class="lamp-container">
        <div class="lamp-wire"></div>
        <div class="lamp-shade">
            <div class="lamp-bulb"></div>
            <!-- Chain -->
            <div class="pull-string" id="pullString" title="Click to turn on the light"></div>
        </div>
        <!-- Roshni -->
        <div class="light-beam"></div>
    </div>

    <!-- Login Form Section -->
    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Enter your details to access your account</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>

    <!-- JavaScript Animation Logic -->
    <script>
        const pullString = document.getElementById('pullString');
        const body = document.body;

        // Chain kheenchne par light on/off
        pullString.addEventListener('click', () => {
            body.classList.toggle('light-on');
        });

        // Fake Login Function
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                btn.style.background = '#16a34a'; // Green color
                
                // Save dummy user
                localStorage.setItem('eduplus_user', JSON.stringify({
                    name: "Mariam Khan",
                    school_name: "Al-Noor Public School"
                }));

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
