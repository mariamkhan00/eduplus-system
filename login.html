<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EduPlus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    :root {
        --primary: #2a5298;
        --primary-hover: #1e3c72;
        --bg-color: #f8f9fa;
        --text-color: #333333;
        --card-bg: #ffffff;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        height: 100vh;
        margin: 0;
        overflow: hidden; /* Scrollbar hatane ke liye */
    }

    .login-wrapper {
        display: flex;
        height: 100vh;
    }

    /* Left Side Image */
    .login-left {
        flex: 1;
        background: url('https://raw.githubusercontent.com/mariamkhan00/eduplus-system/main/EduPlus%20Pakistani%20School%20Welcome.png') center/cover no-repeat;
        position: relative;
        display: none; /* Mobile par hide rahega */
    }

    .login-left::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, rgba(42,82,152,0.85) 0%, rgba(30,60,114,0.9) 100%);
    }

    .login-left-content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 50px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-left-content h1 {
        font-size: 3rem;
        font-weight: 800;
        margin-bottom: 20px;
    }

    .login-left-content p {
        font-size: 1.2rem;
        opacity: 0.9;
        line-height: 1.6;
    }

    /* Right Side Form */
    .login-right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background-color: var(--bg-color);
    }

    .login-box {
        width: 100%;
        max-width: 450px;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .brand-logo {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--primary);
        text-align: center;
        margin-bottom: 10px;
        display: block;
        text-decoration: none;
    }

    .login-box h3 {
        text-align: center;
        font-weight: 700;
        margin-bottom: 30px;
        color: var(--text-color);
    }

    .form-label {
        font-weight: 600;
        font-size: 0.9rem;
    }

    .form-control {
        padding: 12px 15px;
        border-radius: 10px;
        border: 2px solid #e2e8f0;
        font-size: 1rem;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: none;
    }

    .input-group-text {
        background: transparent;
        border: 2px solid #e2e8f0;
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: #888;
    }

    .form-control.with-icon {
        border-left: none;
        border-radius: 0 10px 10px 0;
    }

    .form-control.with-icon:focus {
        border-left: none;
    }

    .btn-login {
        background-color: var(--primary);
        color: white;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1.1rem;
        width: 100%;
        border: none;
        transition: 0.3s;
        margin-top: 10px;
    }

    .btn-login:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.95rem;
    }

    .register-link a {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    /* Show Password Icon */
    .password-toggle {
        position: absolute;
        right: 15px;
        top: 42px;
        cursor: pointer;
        color: #888;
        z-index: 10;
    }

    /* Media Query for Desktop */
    @media (min-width: 992px) {
        .login-left {
            display: block; /* Desktop par image show hogi */
        }
    }
</style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Left Side (Image & Text) -->
        <div class="login-left">
            <div class="login-left-content">
                <a href="index.html" class="brand-logo text-white mb-4"><i class="fas fa-graduation-cap me-2"></i>EduPlus</a>
                <h1>Welcome Back!</h1>
                <p>Log in to manage your institution's timetable, track absentees, and find the perfect substitute teachers automatically.</p>
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="login-right">
            <div class="login-box">
                <!-- Mobile Logo (Sirf mobile par dikhega) -->
                <a href="index.html" class="brand-logo d-lg-none"><i class="fas fa-graduation-cap me-2"></i>EduPlus</a>
                
                <h3>Sign In to Your Account</h3>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control with-icon" id="email" placeholder="admin@school.com" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control with-icon" id="password" placeholder="Enter your password" required>
                        </div>
                        <!-- Eye Icon -->
                        <i class="fas fa-eye password-toggle" onclick="togglePassword()" id="toggleIcon"></i>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe" style="font-size: 0.9rem;">Remember me</label>
                        </div>
                        <a href="#" style="color: var(--primary); font-size: 0.9rem; text-decoration: none; font-weight: 600;">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        Login <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    
                    <!-- Error Message -->
                    <div id="errorMsg" class="text-danger text-center mt-3" style="display: none; font-weight: 600;"></div>
                </form>

                <!-- Register Link -->
                <div class="register-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Password Show/Hide Function
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Handle Login Form Submission
        function handleLogin(event) {
            event.preventDefault(); // Page refresh hone se rokne ke liye
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Button ko loading state mein dalein
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Logging in...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            // Yahan baad mein hum Google Apps Script ka API call lagayenge
            // Abhi ke liye hum ek fake delay create kar rahe hain (Testing ke liye)
            setTimeout(() => {
                
                // DEMO: Agar email aur password sahi hai
                if(email === "admin@school.com" && password === "admin123") {
                    // Login successful
                    btn.innerHTML = '<i class="fas fa-check me-2"></i> Success!';
                    btn.style.background = '#28a745';
                    
                    // User info save karein (baad mein dynamic hoga)
                    localStorage.setItem('eduplus_user', JSON.stringify({
                        name: "Mariam Khan",
                        email: email,
                        role: "admin",
                        school_name: "Al-Noor Public School"
                    }));

                    // 1 second baad dashboard par bhej dein
                    setTimeout(() => {
                        window.location.href = "dashboard.html"; // Humne abhi dashboard nahi banaya
                    }, 1000);

                } else {
                    // Login failed
                    btn.innerHTML = 'Login <i class="fas fa-arrow-right ms-2"></i>';
                    btn.disabled = false;
                    btn.style.background = 'var(--primary)';
                    
                    errorMsg.innerHTML = '<i class="fas fa-exclamation-circle me-1"></i> Invalid email or password';
                    errorMsg.style.display = 'block';
                }

            }, 1500); // 1.5 second ka fake wait
        }
    </script>
</body>
</html>
