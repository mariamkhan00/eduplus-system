<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlus - Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #050705;
            --neon: #39FF14;
            --lime: #A4FF4F;
            --text-main: #FFFFFF;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 1s ease;
            position: relative;
            /* Cyber Grid Background */
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        body.light-on {
            background-color: #07120B; /* Dark Green tint when light is on */
        }

        /* ================= TOP CORNER LOGO ================= */
        .top-logo {
            position: absolute;
            top: 25px;
            left: 40px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            letter-spacing: -1px;
            transition: color 0.3s ease;
        }
        .top-logo i { color: var(--neon); text-shadow: 0 0 10px var(--neon); }

        /* Particles container */
        .particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 0; pointer-events: none;
        }
        .particle {
            position: absolute; background: var(--neon);
            border-radius: 50%; filter: blur(1px);
            animation: float 10s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
            50% { transform: translateY(-50px) translateX(25px); opacity: 0.6; }
        }

        /* ================= MAIN WRAPPER ================= */
        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* ================= LAMP SECTION ================= */
        .lamp-side {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lamp-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-top: -50px; 
        }

        /* Cyberpunk Lamp Base */
        .lamp-base {
            width: 90px;
            height: 12px;
            background: linear-gradient(to bottom, #222, #050705);
            border-radius: 50%;
            margin-top: 210px; 
            position: relative;
            z-index: 2;
            box-shadow: 0 15px 25px rgba(0,0,0,0.8), 0 0 10px rgba(57, 255, 20, 0.1);
        }

        /* Cyberpunk Lamp Pole */
        .lamp-pole {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 220px;
            background: linear-gradient(to right, #111, #444, #111);
            z-index: 1;
            border-radius: 4px;
        }

        /* Cyberpunk Lamp Shade */
        .lamp-shade {
            width: 160px;
            height: 80px;
            background: linear-gradient(to bottom, #1a1a1a, #050705);
            border-top-left-radius: 80px;
            border-top-right-radius: 80px;
            position: relative;
            z-index: 3;
            transition: box-shadow 0.5s ease;
            box-shadow: inset 0 -15px 25px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
            border-bottom: 2px solid #111;
        }

        /* Bulb */
        .lamp-bulb {
            width: 40px;
            height: 40px;
            background-color: #222;
            border-radius: 50%;
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            z-index: 2;
        }

        /* Pull String (Chain) */
        .pull-string-wrapper {
            position: absolute;
            top: 50px;
            left: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s ease;
        }
        
        .pull-string-wrapper:hover {
            transform: translateY(5px);
        }

        .pull-string {
            width: 2px;
            height: 80px;
            background-color: #666;
        }
        .pull-string::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -5px;
            width: 12px;
            height: 12px;
            background-color: var(--neon);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon);
        }

        .click-text {
            position: absolute;
            top: 90px;
            color: var(--neon);
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            animation: pulseText 1.5s infinite;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(57,255,20,0.3);
        }

        @keyframes pulseText {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }

        /* Light Beam (Neon Green Cone) */
        .light-beam {
            position: absolute;
            top: 80px;
            width: 0;
            height: 0;
            border-left: 350px solid transparent;
            border-right: 350px solid transparent;
            border-top: 600px solid rgba(57, 255, 20, 0.0); 
            transition: border-top-color 1s ease;
            z-index: 1;
            pointer-events: none;
            filter: blur(15px);
        }

        /* ======= WHEN LIGHT IS ON ======= */
        body.light-on .lamp-shade {
            box-shadow: inset 0 -15px 25px rgba(0,0,0,0.8), 0 -10px 40px rgba(57, 255, 20, 0.2);
        }
        body.light-on .lamp-bulb {
            background-color: #fff;
            box-shadow: 0 0 40px 15px var(--neon), 0 0 80px 30px rgba(57, 255, 20, 0.4);
        }
        body.light-on .light-beam {
            border-top-color: rgba(57, 255, 20, 0.1);
        }
        body.light-on .click-text {
            display: none;
        }

        /* ================= LOGIN FORM ================= */
        .form-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(5, 7, 5, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(57, 255, 20, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 100;
            
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; 
        }

        body.light-on .login-container {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            border: 1px solid rgba(57, 255, 20, 0.3);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.05);
        }

        .login-container h2 {
            color: #fff;
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-container p {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder { color: #555; }

        .input-group input:focus {
            border-color: var(--neon);
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }
        
        .input-group input:focus + i,
        .input-group input:not(:placeholder-shown) + i {
            color: var(--neon);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
            transform: translateY(-2px);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .register-link a {
            color: var(--lime);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .register-link a:hover {
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(164, 255, 79, 0.5);
        }
        
        /* ================= MOBILE RESPONSIVE FIX ================= */
        @media (max-width: 991px) {
            .main-wrapper {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 80px;
                padding-bottom: 40px;
            }
            .lamp-side {
                flex: none;
                height: auto;
                min-height: 250px;
                align-items: flex-start;
                margin-bottom: 20px;
            }
            .lamp-container {
                transform: scale(0.8);
                margin-top: -20px;
            }
            .light-beam {
                border-left-width: 180px;
                border-right-width: 180px;
                border-top-width: 350px;
            }
            .form-side {
                flex: none;
                padding: 0 15px;
                width: 100%;
            }
            .login-container { 
                width: 100%; 
                padding: 30px 20px;
            }
            .top-logo { 
                top: 20px; 
                left: 20px; 
                font-size: 1.5rem; 
                z-index: 9999;
            }
        }
    </style>
</head>
<body id="bodyElement">

    <!-- Particles Background -->
    <div class="particles-container" id="particles"></div>

    <!-- Corner Logo -->
    <a href="index.html" class="top-logo"><i class="fas fa-graduation-cap"></i> EduPlus</a>

    <div class="main-wrapper">
        
        <!-- LEFT: LAMP -->
        <div class="lamp-side">
            <div class="lamp-container">
                <div class="lamp-shade">
                    <div class="lamp-bulb"></div>
                    <div class="pull-string-wrapper" id="pullString">
                        <div class="pull-string"></div>
                        <div class="click-text">Click to turn on</div>
                    </div>
                </div>
                <div class="light-beam"></div>
                <div class="lamp-pole"></div>
                <div class="lamp-base"></div>
            </div>
        </div>

        <!-- RIGHT: LOGIN FORM -->
        <div class="form-side">
            <div class="login-container">
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email Address" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
                </form>

                <div class="register-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Generate Particles ---
        const particlesContainer = document.getElementById('particles');
        for(let i=0; i<15; i++) {
            let particle = document.createElement('div');
            particle.classList.add('particle');
            let size = Math.random() * 4 + 1;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
            particlesContainer.appendChild(particle);
        }

        const pullString = document.getElementById('pullString');
        const body = document.body;

        // 1. Manual Click
        pullString.addEventListener('click', () => {
            body.classList.toggle('light-on');
        });

        // 2. Scroll Auto Light
        window.addEventListener('scroll', () => {
            body.classList.add('light-on');
        }, { once: true });

        // 3. Mobile Touch Auto Light
        window.addEventListener('touchstart', () => {
            if(!body.classList.contains('light-on')) {
                body.classList.add('light-on');
            }
        }, { once: true });

        // Fake Login
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;
            btn.style.color = '#fff';

            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                btn.style.background = 'var(--neon)';
                btn.style.color = '#000';
                
                localStorage.setItem('eduplus_user', JSON.stringify({
                    name: "Mariam Khan",
                    school_name: "Al-Noor Public School"
                }));

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
